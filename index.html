<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS PLAYER - Ultimate IPTV & Stream Client</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* Embedded CSS to ensure instant loading */
        :root {
            --bg-color: #08080c;
            --panel-bg: rgba(18, 18, 26, 0.75);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #00f2fe;
            --text-main: #ffffff;
            --text-sub: #a0a0b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; overflow: hidden; }

        /* App Layout */
        .nexus-app-container { display: flex; flex-direction: column; height: 100vh; }
        
        /* Header */
        .nexus-header { height: 60px; background: var(--panel-bg); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
        .brand-logo { font-weight: 800; font-size: 1.2rem; letter-spacing: 1px; display: flex; align-items: center; gap: 8px; }
        .highlight { color: var(--accent-color); }
        .logo-spin { color: var(--accent-color); font-size: 1.1rem; }

        .search-bar-wrapper { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 20px; padding: 6px 15px; width: 350px; display: flex; align-items: center; gap: 10px; }
        .search-bar-wrapper input { background: transparent; border: none; outline: none; color: white; width: 100%; font-size: 0.85rem; }

        /* Main Viewport */
        .nexus-body { display: flex; flex: 1; overflow: hidden; }
        .nexus-sidebar { width: 320px; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; }
        .sidebar-tabs { display: flex; border-bottom: 1px solid var(--border-color); }
        .sidebar-tab { flex: 1; padding: 12px; background: transparent; border: none; color: var(--text-sub); cursor: pointer; border-bottom: 2px solid transparent; font-weight: 600; }
        .sidebar-tab.active { color: var(--accent-color); border-bottom-color: var(--accent-color); }

        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px; }
        .nexus-viewport { flex: 1; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }

        .single-player-wrapper { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        video.main-video { width: 100%; height: 100%; object-fit: contain; }

        /* Image sizing in channel cards */
        .channel-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .channel-item-card { display: flex; align-items: center; gap: 12px; padding: 10px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 8px; cursor: pointer; transition: 0.2s; }
        .channel-item-card:hover { background: rgba(0,242,254,0.1); border-color: var(--accent-color); }
        .channel-logo { width: 45px; height: 30px; object-fit: contain; border-radius: 4px; }
        .channel-title { font-size: 0.85rem; font-weight: 600; }
        .channel-group { font-size: 0.75rem; color: var(--text-sub); }

        /* Controls Overlay */
        .player-controls-wrapper { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.9)); padding: 20px; display: flex; flex-direction: column; gap: 10px; opacity: 0; transition: opacity 0.3s; }
        .single-player-wrapper:hover .player-controls-wrapper { opacity: 1; }

        .timeline-container { display: flex; align-items: center; gap: 15px; }
        .nexus-slider { width: 100%; accent-color: var(--accent-color); cursor: pointer; }
        .time-readout { font-size: 0.75rem; color: var(--text-sub); font-family: monospace; }

        .controls-bar { display: flex; justify-content: space-between; align-items: center; }
        .controls-left, .controls-right { display: flex; align-items: center; gap: 15px; }
        .icon-btn, .icon-btn-large { background: transparent; border: none; color: white; cursor: pointer; font-size: 1.1rem; }
        .icon-btn-large { font-size: 1.5rem; color: var(--accent-color); }
        .btn-primary-small { background: var(--accent-color); color: #000; border: none; padding: 8px 14px; border-radius: 6px; font-weight: 700; cursor: pointer; font-size: 0.8rem; }

        .nexus-input, .nexus-select { width: 100%; padding: 8px 12px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 6px; color: white; margin-top: 5px; }
        .nexus-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #12121a; border: 1px solid var(--border-color); padding: 25px; border-radius: 12px; z-index: 100; width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.8); }
        .hidden { display: none !important; }
        .margin-top-10 { margin-top: 10px; }
    </style>
</head>
<body class="amoled-theme" data-theme="amoled">

    <div class="nexus-app-container">
        <!-- Header -->
        <header class="nexus-header">
            <div class="brand-logo">
                <i class="fa-solid fa-circle-notch logo-spin"></i>
                <span class="brand-name">NEXUS<span class="highlight">PLAYER</span></span>
            </div>

            <div class="search-bar-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="input-channel-search" placeholder="Search live channels...">
            </div>

            <div>
                <button id="btn-load-m3u-modal" class="btn-primary-small"><i class="fa-solid fa-plus"></i> Load M3U</button>
            </div>
        </header>

        <!-- Main Layout -->
        <div class="nexus-body">
            <!-- Sidebar -->
            <aside id="nexus-sidebar" class="nexus-sidebar">
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active">IPTV</button>
                </div>

                <div class="sidebar-content">
                    <select id="select-category-filter" class="nexus-select">
                        <option value="All">All Categories</option>
                    </select>
                    <div id="playlist-channel-container" class="channel-list">
                        <!-- Channels Load Here -->
                    </div>
                </div>
            </aside>

            <!-- Video Viewport -->
            <main id="nexus-player-container" class="nexus-viewport">
                <div class="single-player-wrapper">
                    <video id="main-video-element" class="main-video" playsinline crossorigin="anonymous"></video>

                    <!-- Player Controls Overlay -->
                    <div class="player-controls-wrapper">
                        <div class="timeline-container">
                            <input type="range" id="player-progress-bar" class="nexus-slider" min="0" max="100" value="0">
                            <span id="player-time-display" class="time-readout">00:00 / 00:00</span>
                        </div>

                        <div class="controls-bar">
                            <div class="controls-left">
                                <button id="btn-play-pause" class="icon-btn-large">▶</button>
                                <span id="player-stream-title" class="time-readout">No Stream Loaded</span>
                            </div>

                            <div class="controls-right">
                                <button id="btn-pip" class="icon-btn"><i class="fa-solid fa-clone"></i></button>
                                <button id="btn-fullscreen" class="icon-btn"><i class="fa-solid fa-expand"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- M3U Loader Modal -->
    <div id="modal-m3u-loader" class="nexus-modal hidden">
        <h3>Load M3U Playlist</h3>
        <input type="text" id="input-m3u-url" class="nexus-input margin-top-10" placeholder="Paste M3U URL here...">
        <button id="btn-parse-m3u-url" class="btn-primary-small margin-top-10">Load Stream</button>
    </div>

    <!-- JavaScript Engines -->
    <script src="js/js/storage.js"></script>
    <script src="js/js/videolab.js"></script>
    <script src="js/js/audio.js"></script>
    <script src="js/js/m3u.js"></script>
    <script src="js/js/player.js"></script>
    <script src="js/js/main.js"></script>
</body>
</html>
