<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus Player</title>
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    
    <!-- Link directly to style.css in the root directory -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="amoled-theme">
    <div class="nexus-app-container">
        
        <!-- Top Header Bar -->
        <header class="nexus-header glass-panel">
            <div class="header-left">
                <button class="icon-btn" id="btnToggleSidebar"><i class="fa-solid fa-bars"></i></button>
                <div class="brand-logo">
                    <i class="fa-solid fa-atom logo-spin"></i>
                    <span class="brand-name">NEXUS <span class="highlight">PLAYER</span></span>
                </div>
            </div>

            <div class="header-right">
                <div class="search-bar-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="globalSearchInput" placeholder="Search channels, media, settings...">
                    <button class="icon-btn-small hidden" id="btnClearSearch"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <button class="icon-btn" id="btnOpenTelemetry" title="Telemetry HUD"><i class="fa-solid fa-microchip"></i></button>
                <button class="icon-btn" id="btnOpenVideoLab" title="Video Processing Lab"><i class="fa-solid fa-wand-magic-sparkles"></i></button>
                <button class="icon-btn" id="btnOpenAudioEngine" title="Audio FX & Equalizer"><i class="fa-solid fa-sliders"></i></button>
            </div>
        </header>

        <!-- Main Body Area -->
        <div class="nexus-body">
            
            <!-- Left Sidebar Navigation -->
            <aside class="nexus-sidebar glass-panel" id="mainSidebar">
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" data-tab="paneIPTV"><i class="fa-solid fa-tv"></i> IPTV</button>
                    <button class="sidebar-tab" data-tab="paneMedia"><i class="fa-solid fa-folder-open"></i> Media</button>
                    <button class="sidebar-tab" data-tab="paneEPG"><i class="fa-solid fa-list-check"></i> EPG</button>
                    <button class="sidebar-tab" data-tab="paneStarred"><i class="fa-solid fa-star"></i> Starred</button>
                </div>

                <div class="sidebar-content">
                    <!-- IPTV Pane -->
                    <div class="tab-pane active" id="paneIPTV">
                        <div class="pane-controls">
                            <select id="iptvCategoryFilter" class="nexus-select">
                                <option value="ALL">All Categories</option>
                            </select>
                            <button class="btn-primary-small" id="btnLoadPlaylistModal"><i class="fa-solid fa-plus"></i> Playlist</button>
                        </div>
                        <div class="channel-list" id="iptvChannelList">
                            <!-- Channel items rendered dynamically -->
                        </div>
                    </div>

                    <!-- Local Media Pane -->
                    <div class="tab-pane" id="paneMedia">
                        <div class="file-picker-wrapper">
                            <label for="localFileSelector" class="btn-primary-small block-btn">
                                <i class="fa-solid fa-file-video"></i> Open Local Media
                            </label>
                            <input type="file" id="localFileSelector" accept="video/*,audio/*" multiple class="hidden">
                        </div>
                        <div class="media-playlist" id="localPlaylist">
                            <!-- Local files list -->
                        </div>
                    </div>

                    <!-- EPG Pane -->
                    <div class="tab-pane" id="paneEPG">
                        <div class="epg-container" id="epgContainer">
                            <p class="text-muted">Load an XMLTV source to view schedule.</p>
                        </div>
                    </div>

                    <!-- Starred Pane -->
                    <div class="tab-pane" id="paneStarred">
                        <div class="starred-list" id="starredList">
                            <!-- Favorite items -->
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Main Video Viewport -->
            <main class="nexus-viewport" id="viewportContainer">
                <div class="single-player-wrapper">
                    <!-- Ambient Glow Canvas -->
                    <canvas class="ambient-canvas" id="ambientCanvas"></canvas>

                    <!-- Main HTML5 Video Element -->
                    <video id="mainVideoPlayer" class="main-video" crossorigin="anonymous" playsinline></video>

                    <!-- WebGL Post-Processing Canvas Overlay -->
                    <canvas class="processing-canvas hidden" id="glCanvas"></canvas>

                    <!-- Audio Visualizer Overlay -->
                    <canvas class="visualizer-canvas hidden" id="audioVisualizerCanvas"></canvas>

                    <!-- Gesture Touch Layer -->
                    <div class="gesture-surface" id="gestureSurface">
                        <div class="gesture-feedback" id="gestureFeedback">
                            <i class="fa-solid fa-volume-high"></i> <span>100%</span>
                        </div>
                    </div>

                    <!-- Subtitle Overlay Layer -->
                    <div class="subtitle-overlay" id="subtitleOverlay">
                        <span class="subtitle-text" id="subtitleText"></span>
                    </div>

                    <!-- Telemetry Performance HUD Overlay -->
                    <div class="telemetry-hud glass-panel hidden" id="telemetryHud">
                        <div><span class="hud-label">FPS:</span> <span class="hud-value" id="hudFps">60</span></div>
                        <div><span class="hud-label">Res:</span> <span class="hud-value" id="hudRes">1920x1080</span></div>
                        <div><span class="hud-label">Buffer:</span> <span class="hud-value" id="hudBuffer">12s</span></div>
                        <div><span class="hud-label">Dropped Frames:</span> <span class="hud-value" id="hudDropped">0</span></div>
                    </div>
                </div>

                <!-- Floating Bottom Player Controls Overlay -->
                <div class="player-controls-wrapper glass-panel" id="controlsWrapper">
                    
                    <!-- Timeline & Progress Scrubber -->
                    <div class="timeline-container">
                        <span class="time-readout" id="currentTimeReadout">00:00:00</span>
                        <input type="range" class="nexus-slider scrubber" id="timelineScrubber" min="0" max="100" value="0" step="0.1">
                        <span class="time-readout" id="durationReadout">00:00:00</span>
                    </div>

                    <div class="controls-bar">
                        <!-- Controls Left -->
                        <div class="controls-left">
                            <button class="icon-btn-large" id="btnPlayPause"><i class="fa-solid fa-play"></i></button>
                            <button class="icon-btn" id="btnStop"><i class="fa-solid fa-square"></i></button>
                            
                            <div class="volume-control-group">
                                <button class="icon-btn" id="btnMuteToggle"><i class="fa-solid fa-volume-high"></i></button>
                                <input type="range" class="nexus-slider volume-slider" id="volumeSlider" min="0" max="1" step="0.05" value="1">
                            </div>
                        </div>

                        <!-- Controls Center: Track Info -->
                        <div class="controls-center">
                            <div class="media-title-marquee" id="mediaTitle">Nexus Player - Ready</div>
                        </div>

                        <!-- Controls Right -->
                        <div class="controls-right">
                            <button class="icon-btn" id="btnSubtitles"><i class="fa-solid fa-closed-captioning"></i></button>
                            <button class="icon-btn" id="btnAudioTracks"><i class="fa-solid fa-language"></i></button>
                            <button class="icon-btn" id="btnPiP"><i class="fa-solid fa-clone"></i></button>
                            <button class="icon-btn" id="btnFullscreen"><i class="fa-solid fa-expand"></i></button>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modals and Drawers -->
    
    <!-- Video Processing Lab Drawer -->
    <div class="nexus-drawer glass-panel hidden" id="videoLabDrawer">
        <div class="drawer-header">
            <h3><i class="fa-solid fa-wand-magic-sparkles"></i> Video Lab</h3>
            <button class="icon-btn-small" id="btnCloseVideoLab"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="drawer-body">
            <div class="control-card">
                <h4>Color Grading</h4>
                <div class="slider-row">
                    <label>Brightness <span id="valBrightness">100%</span></label>
                    <input type="range" class="nexus-slider" id="sliderBrightness" min="0" max="200" value="100">
                </div>
                <div class="slider-row">
                    <label>Contrast <span id="valContrast">100%</span></label>
                    <input type="range" class="nexus-slider" id="sliderContrast" min="0" max="200" value="100">
                </div>
                <div class="slider-row">
                    <label>Saturation <span id="valSaturation">100%</span></label>
                    <input type="range" class="nexus-slider" id="sliderSaturation" min="0" max="200" value="100">
                </div>
                <button class="btn-text-reset" id="btnResetColorGrading">Reset to Default</button>
            </div>
        </div>
    </div>

    <!-- Audio FX & Equalizer Drawer -->
    <div class="nexus-drawer glass-panel hidden" id="audioEngineDrawer">
        <div class="drawer-header">
            <h3><i class="fa-solid fa-sliders"></i> Audio FX & Equalizer</h3>
            <button class="icon-btn-small" id="btnCloseAudioEngine"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="drawer-body">
            <div class="control-card">
                <div class="toggle-row">
                    <span>Enable Equalizer</span>
                    <label class="nexus-switch">
                        <input type="checkbox" id="toggleEqEnable">
                        <span class="slider round"></span>
                    </label>
                </div>
                <div class="eq-band-container">
                    <div class="eq-slider-col"><input type="range" id="eq60" min="-12" max="12" value="0"><span>60Hz</span></div>
                    <div class="eq-slider-col"><input type="range" id="eq230" min="-12" max="12" value="0"><span>230Hz</span></div>
                    <div class="eq-slider-col"><input type="range" id="eq910" min="-12" max="12" value="0"><span>910Hz</span></div>
                    <div class="eq-slider-col"><input type="range" id="eq4k" min="-12" max="12" value="0"><span>4kHz</span></div>
                    <div class="eq-slider-col"><input type="range" id="eq14k" min="-12" max="12" value="0"><span>14kHz</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Playlist / Stream URL Modal -->
    <div class="nexus-modal glass-panel hidden" id="playlistModal">
        <div class="modal-header">
            <h3>Load Stream / M3U Playlist</h3>
            <button class="icon-btn-small" id="btnClosePlaylistModal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <input type="text" id="iptvUrlInput" class="nexus-input" placeholder="Paste .m3u / .m3u8 URL here...">
            <div class="button-row-duo margin-top-10">
                <button class="btn-primary-small block-btn" id="btnConfirmLoadUrl">Load Stream</button>
            </div>
        </div>
    </div>

    <!-- Application Core Scripts -->
    <script src="js/storage.js"></script>
    <script src="js/videolab.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/m3u.js"></script>
    <script src="js/player.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
