<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>NEXUS PLAYER - Full Feature Mobile Edition</title>

    <!-- External CSS File -->
    <link rel="stylesheet" href="css/style.css">
    
    <!-- External Libraries & Icons -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #08080c;
            --panel-bg: rgba(18, 18, 26, 0.95);
            --border-color: rgba(255, 255, 255, 0.12);
            --accent-color: #00f2fe;
            --text-main: #ffffff;
            --text-sub: #a0a0b0;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        html, body { background-color: var(--bg-color); color: var(--text-main); height: 100vh; width: 100vw; overflow: hidden; }

        .nexus-app-container { display: flex; flex-direction: column; height: 100vh; width: 100vw; position: relative; }
        
        /* Header Bar */
        .nexus-header { height: 50px; background: var(--panel-bg); border-bottom: 1px solid var(--border-color); display: flex; align-items: center; justify-content: space-between; padding: 0 10px; z-index: 10; }
        .header-left, .header-right { display: flex; align-items: center; gap: 8px; }
        .brand-logo { font-weight: 800; font-size: 0.95rem; letter-spacing: 0.5px; }
        .highlight { color: var(--accent-color); }

        .search-bar-wrapper { background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 15px; padding: 4px 10px; flex: 1; max-width: 160px; display: flex; align-items: center; gap: 6px; }
        .search-bar-wrapper input { background: transparent; border: none; outline: none; color: white; width: 100%; font-size: 0.75rem; }

        /* Main Body Layout */
        .nexus-body { display: flex; flex: 1; position: relative; width: 100%; height: calc(100vh - 50px); overflow: hidden; }
        
        /* Collapsible Mobile Drawers */
        .nexus-drawer { position: absolute; top: 0; bottom: 0; width: 290px; background: var(--panel-bg); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 20; transform: translateX(-100%); transition: transform 0.3s ease; }
        .nexus-drawer.drawer-right { right: 0; left: auto; border-right: none; border-left: 1px solid var(--border-color); transform: translateX(100%); }
        .nexus-drawer.active { transform: translateX(0); }

        .drawer-tabs { display: flex; border-bottom: 1px solid var(--border-color); }
        .drawer-tab { flex: 1; padding: 10px 5px; background: transparent; border: none; color: var(--text-sub); font-weight: 600; font-size: 0.75rem; cursor: pointer; }
        .drawer-tab.active { color: var(--accent-color); border-bottom: 2px solid var(--accent-color); }

        .drawer-content { flex: 1; overflow-y: auto; padding: 12px; }
        .tab-pane { display: none; }
        .tab-pane.active { display: block; }
        
        /* Control Cards */
        .control-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px; margin-bottom: 10px; }
        .control-card h4 { font-size: 0.8rem; margin-bottom: 8px; color: var(--accent-color); display: flex; align-items: center; gap: 6px; }
        
        .slider-group { display: flex; flex-direction: column; gap: 4px; margin-bottom: 8px; }
        .slider-label { font-size: 0.7rem; color: var(--text-sub); display: flex; justify-content: space-between; }

        /* Video Viewport */
        .nexus-viewport { flex: 1; background: #000; width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        .single-player-wrapper { width: 100%; height: 100%; position: relative; display: flex; align-items: center; justify-content: center; }
        video.main-video { width: 100%; height: 100%; object-fit: contain; background: #000; }

        .subtitle-overlay { position: absolute; bottom: 60px; left: 5%; right: 5%; text-align: center; color: #fff; text-shadow: 0 2px 4px #000; font-size: 1rem; font-weight: 600; pointer-events: none; z-index: 4; }

        /* Channel List */
        .channel-list { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .channel-item-card { display: flex; align-items: center; gap: 10px; padding: 8px; background: rgba(255,255,255,0.03); border: 1px solid var(--border-color); border-radius: 6px; cursor: pointer; }
        .channel-logo { width: 35px; height: 25px; object-fit: contain; }
        .channel-title { font-size: 0.75rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Controls Overlay */
        .player-controls-wrapper { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(transparent, rgba(0,0,0,0.95)); padding: 10px; display: flex; flex-direction: column; gap: 6px; z-index: 5; }
        .timeline-container { display: flex; align-items: center; gap: 10px; }
        .nexus-slider { width: 100%; accent-color: var(--accent-color); cursor: pointer; }
        .time-readout { font-size: 0.7rem; color: var(--text-sub); font-family: monospace; white-space: nowrap; }

        .controls-bar { display: flex; justify-content: space-between; align-items: center; }
        .controls-left, .controls-right { display: flex; align-items: center; gap: 10px; }
        .icon-btn, .icon-btn-large { background: transparent; border: none; color: white; cursor: pointer; font-size: 0.95rem; }
        .icon-btn-large { font-size: 1.2rem; color: var(--accent-color); }
        .btn-primary-small { background: var(--accent-color); color: #000; border: none; padding: 5px 9px; border-radius: 4px; font-weight: 700; font-size: 0.7rem; cursor: pointer; }

        .nexus-input, .nexus-select { width: 100%; padding: 6px 8px; background: rgba(255,255,255,0.05); border: 1px solid var(--border-color); border-radius: 4px; color: white; font-size: 0.75rem; margin-top: 4px; }
        .nexus-modal { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #12121a; border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; z-index: 100; width: 90%; max-width: 350px; }
        .hidden { display: none !important; }
        .margin-top-10 { margin-top: 10px; }

        /* Desktop Adjustments */
        @media (min-width: 768px) {
            .nexus-drawer { position: relative; transform: none; width: 280px; }
            .nexus-drawer.drawer-right { position: relative; transform: none; width: 280px; }
            .search-bar-wrapper { max-width: 250px; }
        }
    </style>
</head>
<body class="amoled-theme" data-theme="amoled">

    <div class="nexus-app-container">
        <!-- Header Bar -->
        <header class="nexus-header">
            <div class="header-left">
                <button id="btn-toggle-sidebar" class="icon-btn" title="IPTV Channels">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="brand-logo">
                    <span class="brand-name">NEXUS<span class="highlight">PLAYER</span></span>
                </div>
            </div>

            <div class="search-bar-wrapper">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="input-channel-search" placeholder="Search channels...">
            </div>

            <div class="header-right">
                <button id="btn-load-m3u-modal" class="btn-primary-small">+ M3U</button>
                <button id="btn-toggle-tools" class="icon-btn" title="Lab & FX Tools">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </div>
        </header>

        <!-- Main Body -->
        <div class="nexus-body">
            <!-- Left Drawer: IPTV Channels & Direct Links -->
            <aside id="nexus-sidebar" class="nexus-drawer">
                <div class="drawer-tabs">
                    <button class="drawer-tab active" data-tab="tab-iptv"><i class="fa-solid fa-tv"></i> IPTV</button>
                    <button class="drawer-tab" data-tab="tab-media"><i class="fa-solid fa-link"></i> DIRECT</button>
                </div>

                <div class="drawer-content">
                    <div id="tab-iptv" class="tab-pane active">
                        <select id="select-category-filter" class="nexus-select">
                            <option value="All">All Categories</option>
                        </select>
                        <div id="playlist-channel-container" class="channel-list"></div>
                    </div>

                    <div id="tab-media" class="tab-pane">
                        <div class="control-card">
                            <h4><i class="fa-solid fa-link"></i> Direct Stream</h4>
                            <input type="text" id="input-direct-stream-url" class="nexus-input" placeholder="https://example.com/stream.m3u8">
                            <button id="btn-load-direct-stream" class="btn-primary-small margin-top-10">Play URL</button>
                        </div>
                        <div class="control-card">
                            <h4><i class="fa-solid fa-folder-open"></i> Local Video</h4>
                            <input type="file" id="input-local-file" class="nexus-input" accept="video/*">
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Video Viewport -->
            <main id="nexus-player-container" class="nexus-viewport">
                <div class="single-player-wrapper">
                    <video id="main-video-element" class="main-video" playsinline crossorigin="anonymous"></video>
                    <canvas id="video-processing-canvas" class="hidden"></canvas>
                    
                    <div id="subtitle-overlay" class="subtitle-overlay"></div>

                    <!-- Overlay Controls -->
                    <div class="player-controls-wrapper">
                        <div class="timeline-container">
                            <input type="range" id="player-progress-bar" class="nexus-slider" min="0" max="100" value="0">
                            <span id="player-time-display" class="time-readout">00:00 / 00:00</span>
                        </div>

                        <div class="controls-bar">
                            <div class="controls-left">
                                <button id="btn-play-pause" class="icon-btn-large">▶</button>
                                <span id="player-stream-title" class="time-readout">No Stream Loaded</span>
                            </div>

                            <div class="controls-right">
                                <button id="btn-pip" class="icon-btn"><i class="fa-solid fa-clone"></i></button>
                                <button id="btn-fullscreen" class="icon-btn"><i class="fa-solid fa-expand"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>

            <!-- Right Drawer: Video Lab & Audio Studio -->
            <aside id="nexus-tools-drawer" class="nexus-drawer drawer-right">
                <div class="drawer-tabs">
                    <button class="drawer-tab active" data-tab="tab-videolab"><i class="fa-solid fa-wand-magic-sparkles"></i> VIDEO LAB</button>
                    <button class="drawer-tab" data-tab="tab-audio"><i class="fa-solid fa-sliders"></i> AUDIO</button>
                    <button class="drawer-tab" data-tab="tab-subs"><i class="fa-solid fa-closed-captioning"></i> SUBS</button>
                </div>

                <div class="drawer-content">
                    <!-- Video Lab -->
                    <div id="tab-videolab" class="tab-pane active">
                        <div class="control-card">
                            <h4><i class="fa-solid fa-film"></i> Movie Look Preset</h4>
                            <input type="text" id="movie-grade-search-input" class="nexus-input" placeholder="Matrix, Mad Max, Batman...">
                            <button id="btn-apply-movie-grade" class="btn-primary-small margin-top-10">Apply Grade</button>
                        </div>

                        <div class="control-card">
                            <h4><i class="fa-solid fa-sliders"></i> Color Grading</h4>
                            <div class="slider-group">
                                <div class="slider-label"><span>Brightness</span><span id="val-brightness">100%</span></div>
                                <input type="range" id="slider-brightness" class="nexus-slider" min="50" max="150" value="100">
                            </div>
                            <div class="slider-group">
                                <div class="slider-label"><span>Contrast</span><span id="val-contrast">100%</span></div>
                                <input type="range" id="slider-contrast" class="nexus-slider" min="50" max="150" value="100">
                            </div>
                            <div class="slider-group">
                                <div class="slider-label"><span>Saturation</span><span id="val-saturation">100%</span></div>
                                <input type="range" id="slider-saturation" class="nexus-slider" min="0" max="200" value="100">
                            </div>
                            <div class="slider-group">
                                <div class="slider-label"><span>Hue Rotation</span><span id="val-hue">0°</span></div>
                                <input type="range" id="slider-hue" class="nexus-slider" min="0" max="360" value="0">
                            </div>
                            <button id="btn-reset-videolab" class="btn-primary-small margin-top-10" style="background: rgba(255,255,255,0.1); color: white;">Reset Color</button>
                        </div>
                    </div>

                    <!-- Audio Studio -->
                    <div id="tab-audio" class="tab-pane">
                        <div class="control-card">
                            <h4><i class="fa-solid fa-volume-high"></i> Audio Enhancer</h4>
                            <div class="slider-group">
                                <div class="slider-label"><span>Master Volume</span><span id="val-master-vol">100%</span></div>
                                <input type="range" id="slider-master-volume" class="nexus-slider" min="0" max="1" step="0.05" value="1">
                            </div>
                            <div class="slider-group">
                                <div class="slider-label"><span>Audio Profile</span></div>
                                <select id="select-audio-profile" class="nexus-select">
                                    <option value="flat">Flat (Default)</option>
                                    <option value="bass">Bass Boost</option>
                                    <option value="vocal">Vocal Enhancer</option>
                                    <option value="night">Night Mode</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <!-- Subtitles -->
                    <div id="tab-subs" class="tab-pane">
                        <div class="control-card">
                            <h4><i class="fa-solid fa-file-code"></i> Subtitle File</h4>
                            <input type="file" id="input-subtitle-file" class="nexus-input" accept=".srt,.vtt">
                        </div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- M3U Loader Modal -->
    <div id="modal-m3u-loader" class="nexus-modal hidden">
        <h4 style="font-size: 0.85rem;">Load M3U / IPTV Playlist</h4>
        <input type="text" id="input-m3u-url" class="nexus-input margin-top-10" placeholder="Paste .m3u or .m3u8 link...">
        <div style="display: flex; gap: 8px;" class="margin-top-10">
            <button id="btn-parse-m3u-url" class="btn-primary-small" style="flex: 1;">Load Stream</button>
            <button class="btn-primary-small btn-close-modal" style="background: rgba(255,255,255,0.2); color: white;">Close</button>
        </div>
    </div>

    <!-- External Script Files -->
    <script src="js/storage.js"></script>
    <script src="js/videolab.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/m3u.js"></script>
    <script src="js/player.js"></script>
    <script src="js/main.js"></script>

    <!-- UI Interactions -->
    <script>
        document.getElementById('btn-toggle-sidebar')?.addEventListener('click', () => {
            document.getElementById('nexus-tools-drawer')?.classList.remove('active');
            document.getElementById('nexus-sidebar')?.classList.toggle('active');
        });

        document.getElementById('btn-toggle-tools')?.addEventListener('click', () => {
            document.getElementById('nexus-sidebar')?.classList.remove('active');
            document.getElementById('nexus-tools-drawer')?.classList.toggle('active');
        });

        document.querySelectorAll('.drawer-tabs').forEach(tabGroup => {
            tabGroup.addEventListener('click', (e) => {
                const btn = e.target.closest('.drawer-tab');
                if (!btn) return;
                
                const targetTab = btn.getAttribute('data-tab');
                const parentDrawer = btn.closest('.nexus-drawer');

                parentDrawer.querySelectorAll('.drawer-tab').forEach(t => t.classList.remove('active'));
                parentDrawer.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

                btn.classList.add('active');
                const pane = parentDrawer.querySelector(`#${targetTab}`);
                if (pane) pane.classList.add('active');
            });
        });

        document.getElementById('btn-load-m3u-modal')?.addEventListener('click', () => {
            document.getElementById('modal-m3u-loader')?.classList.remove('hidden');
        });

        document.querySelectorAll('.btn-close-modal').forEach(btn => {
            btn.addEventListener('click', () => {
                document.getElementById('modal-m3u-loader')?.classList.add('hidden');
            });
        });
    </script>
</body>
</html>
