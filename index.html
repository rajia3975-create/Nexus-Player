<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUS PLAYER - Ultimate IPTV & Stream Client</title>
    
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="https://cdn.dashjs.org/latest/dash.all.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Application Stylesheet -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="amoled-theme" data-theme="amoled">

    <div class="nexus-app-container">
        <!-- Top Header Bar -->
        <header class="nexus-header glass-panel">
            <div class="header-left">
                <button id="btn-toggle-sidebar" class="icon-btn" title="Toggle Sidebar">
                    <i class="fa-solid fa-bars"></i>
                </button>
                <div class="brand-logo">
                    <i class="fa-solid fa-circle-notch logo-spin"></i>
                    <span class="brand-name">NEXUS<span class="highlight">PLAYER</span></span>
                </div>
            </div>

            <div class="header-center">
                <div class="search-bar-wrapper">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="input-channel-search" placeholder="Search live channels, videos, M3U lists...">
                </div>
            </div>

            <div class="header-right">
                <button id="btn-load-m3u-modal" class="btn-primary-small" title="Load M3U Playlist">
                    <i class="fa-solid fa-plus"></i> Load M3U/Xtream
                </button>
                <button id="btn-open-settings" class="icon-btn" title="Settings">
                    <i class="fa-solid fa-gear"></i>
                </button>
            </div>
        </header>

        <!-- Main Body Layout -->
        <div class="nexus-body">
            <!-- Sidebar Drawer -->
            <aside id="nexus-sidebar" class="nexus-sidebar glass-panel">
                <div class="sidebar-tabs">
                    <button class="sidebar-tab active" data-tab="tab-iptv"><i class="fa-solid fa-tv"></i> IPTV</button>
                    <button class="sidebar-tab" data-tab="tab-media"><i class="fa-solid fa-folder"></i> Media</button>
                    <button class="sidebar-tab" data-tab="tab-epg"><i class="fa-solid fa-list-ol"></i> EPG</button>
                    <button class="sidebar-tab" data-tab="tab-starred"><i class="fa-solid fa-star"></i> Starred</button>
                </div>

                <div class="sidebar-content">
                    <!-- IPTV Category & Playlist View -->
                    <div id="tab-iptv" class="tab-pane active">
                        <div class="pane-controls">
                            <select id="select-category-filter" class="nexus-select">
                                <option value="All">All Categories</option>
                            </select>
                        </div>
                        <div id="playlist-channel-container" class="channel-list">
                            <!-- Dynamic Channel Items Inserted Here -->
                        </div>
                    </div>

                    <!-- Direct Media / Stream Loader View -->
                    <div id="tab-media" class="tab-pane">
                        <div class="control-card">
                            <h4><i class="fa-solid fa-link"></i> Load Direct Stream URL</h4>
                            <input type="text" id="input-direct-stream-url" class="nexus-input" placeholder="https://example.com/stream.m3u8">
                            <button id="btn-load-direct-stream" class="btn-primary-small margin-top-10">Play Stream</button>
                        </div>
                        <div class="control-card margin-top-10">
                            <h4><i class="fa-solid fa-file-arrow-up"></i> Open Storage File</h4>
                            <input type="file" id="input-local-file" class="nexus-input" accept="video/*">
                        </div>
                    </div>
                </div>
            </aside>

            <!-- Video Viewport & Controls -->
            <main id="nexus-player-container" class="nexus-viewport">
                <div class="single-player-wrapper">
                    <video id="main-video-element" class="main-video" playsinline crossorigin="anonymous"></video>
                    <canvas id="video-processing-canvas" class="ambient-canvas hidden"></canvas>
                    
                    <!-- Subtitle Rendering Overlay -->
                    <div id="subtitle-overlay" class="subtitle-overlay"></div>

                    <!-- Player Controls Overlay -->
                    <div class="player-controls-wrapper">
                        <div class="timeline-container">
                            <input type="range" id="player-progress-bar" class="nexus-slider scrubber" min="0" max="100" value="0">
                            <span id="player-time-display" class="time-readout">00:00 / 00:00</span>
                        </div>

                        <div class="controls-bar">
                            <div class="controls-left">
                                <button id="btn-play-pause" class="icon-btn-large">▶</button>
                                <div class="volume-control-group">
                                    <i class="fa-solid fa-volume-high"></i>
                                    <input type="range" id="slider-master-volume" class="nexus-slider volume-slider" min="0" max="1" step="0.05" value="1">
                                </div>
                                <span id="player-stream-title" class="stream-title-text">No Stream Loaded</span>
                            </div>

                            <div class="controls-right">
                                <button id="btn-pip" class="icon-btn" title="Picture in Picture"><i class="fa-solid fa-clone"></i></button>
                                <button id="btn-fullscreen" class="icon-btn" title="Fullscreen"><i class="fa-solid fa-expand"></i></button>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- M3U / Xtream Loader Modal -->
    <div id="modal-m3u-loader" class="nexus-modal glass-panel hidden">
        <div class="modal-header">
            <h3><i class="fa-solid fa-list"></i> Load M3U Playlist</h3>
            <button class="icon-btn btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <label>M3U / M3U8 Playlist URL</label>
            <input type="text" id="input-m3u-url" class="nexus-input" placeholder="https://example.com/playlist.m3u8">
            <button id="btn-parse-m3u-url" class="btn-primary-small margin-top-10">Load Playlist</button>
        </div>
    </div>

    <!-- Application Engine Scripts (Using Updated Path: js/js/) -->
    <script src="js/js/storage.js"></script>
    <script src="js/js/videolab.js"></script>
    <script src="js/js/audio.js"></script>
    <script src="js/js/m3u.js"></script>
    <script src="js/js/player.js"></script>
    <script src="js/js/main.js"></script>
</body>
</html>
