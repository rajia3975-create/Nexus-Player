<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nexus Player — Ultimate Media Platform</title>
  <!-- HLS Engine -->
  <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
  <style>
    :root {
      --bg-primary: #090d16;
      --bg-card: rgba(22, 30, 46, 0.7);
      --accent-color: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.35);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 20px;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .brand-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent-color);
    }

    .app-container {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 16px;
      max-width: 1400px;
      margin: 0 auto;
      width: 100%;
    }

    @media (min-width: 900px) {
      .app-container { grid-template-columns: 2fr 1fr; }
    }

    .viewport-card {
      position: relative;
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      overflow: hidden;
    }

    .media-wrapper {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      transition: filter 0.1s ease;
    }

    .control-center {
      background: var(--bg-card);
      border-radius: 16px;
      border: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
    }

    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--accent-color);
      color: #000;
    }

    .tab-panel { display: none; flex-direction: column; gap: 12px; }
    .tab-panel.active { display: flex; }

    .control-group { display: flex; flex-direction: column; gap: 6px; }
    .control-group label { font-size: 0.8rem; color: var(--text-muted); display: flex; justify-content: space-between; }

    input[type="text"] {
      width: 100%;
      padding: 10px;
      background: #0d1322;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      color: var(--text-main);
      font-size: 0.85rem;
    }

    input[type="range"] { width: 100%; accent-color: var(--accent-color); }

    .btn {
      padding: 10px 16px;
      background: var(--accent-color);
      color: #000;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .preset-chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip-btn {
      background: #162032;
      border: 1px solid var(--border-color);
      color: var(--text-main);
      padding: 6px 10px;
      font-size: 0.75rem;
      border-radius: 6px;
      cursor: pointer;
    }

    .channel-list {
      max-height: 250px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: #0b101d;
    }

    .channel-item {
      padding: 10px 12px;
      font-size: 0.85rem;
      border-bottom: 1px solid var(--border-color);
      cursor: pointer;
      display: flex;
      justify-content: space-between;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">⚡ Nexus Player</div>
    <span style="font-size: 0.75rem; color: var(--text-muted);">v1.2-standalone</span>
  </header>

  <div class="app-container">
    <div class="viewport-card">
      <div class="media-wrapper">
        <video id="nexusVideo" controls playsinline></video>
      </div>
    </div>

    <div class="control-center">
      <div class="tabs">
        <button class="tab-btn active" onclick="switchTab(event, 'iptv')">📺 IPTV</button>
        <button class="tab-btn" onclick="switchTab(event, 'videolab')">🎨 Video Lab</button>
        <button class="tab-btn" onclick="switchTab(event, 'audio')">🎵 Audio</button>
      </div>

      <!-- IPTV Panel -->
      <div id="tab-iptv" class="tab-panel active">
        <div class="control-group">
          <label for="m3uUrl">M3U Playlist / Stream URL</label>
          <input type="text" id="m3uUrl" placeholder="https://example.com/playlist.m3u">
        </div>

        <div class="control-group">
          <label>Quick Playlists</label>
          <div class="preset-chips">
            <button class="chip-btn" onclick="quickLoad('https://iptv-org.github.io/iptv/categories/movies.m3u')">🎬 Movies</button>
            <button class="chip-btn" onclick="quickLoad('https://iptv-org.github.io/iptv/countries/in.m3u')">🇮🇳 India</button>
          </div>
        </div>

        <button class="btn" onclick="loadM3U()">Load Playlist</button>

        <div class="control-group" style="margin-top: 8px;">
          <input type="text" id="channelSearch" placeholder="Search channels..." oninput="filterChannels()">
        </div>

        <div class="control-group">
          <div id="channelList" class="channel-list">
            <div class="channel-item">No channels loaded yet.</div>
          </div>
        </div>
      </div>

      <!-- Video Lab Panel -->
      <div id="tab-videolab" class="tab-panel">
        <div class="control-group">
          <label>Cinema Presets</label>
          <div class="preset-chips">
            <button class="chip-btn" onclick="applyPreset(110, 140, 70, 150)">Matrix</button>
            <button class="chip-btn" onclick="applyPreset(105, 135, 150, 0)">Action</button>
            <button class="chip-btn" onclick="applyPreset(100, 160, 0, 0)">Noir</button>
          </div>
        </div>
        <div class="control-group">
          <label>Brightness <span id="val-brightness">100%</span></label>
          <input type="range" id="slider-brightness" min="0" max="200" value="100" oninput="updateFilters()">
        </div>
        <div class="control-group">
          <label>Contrast <span id="val-contrast">100%</span></label>
          <input type="range" id="slider-contrast" min="0" max="200" value="100" oninput="updateFilters()">
        </div>
        <div class="control-group">
          <label>Saturation <span id="val-saturate">100%</span></label>
          <input type="range" id="slider-saturate" min="0" max="200" value="100" oninput="updateFilters()">
        </div>
        <button class="btn" style="background: #334155; color: #fff;" onclick="resetFilters()">Reset</button>
      </div>

      <!-- Audio Panel -->
      <div id="tab-audio" class="tab-panel">
        <div class="control-group">
          <label>Volume Boost (Gain)</label>
          <input type="range" id="audioGain" min="1" max="5" step="0.1" value="1" oninput="updateAudioGain(this.value)">
        </div>
      </div>
    </div>
  </div>

  <script>
    const video = document.getElementById('nexusVideo');
    let hls = new Hls();
    let loadedChannels = [];

    function switchTab(evt, tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));
      evt.currentTarget.classList.add('active');
      document.getElementById(`tab-${tabId}`).classList.add('active');
    }

    function playStream(url) {
      if (Hls.isSupported()) {
        hls.destroy();
        hls = new Hls();
        hls.loadSource(url);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch(() => {}));
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = url;
        video.play().catch(() => {});
      }
    }

    async function fetchPlaylistData(rawUrl) {
      try {
        const res = await fetch(rawUrl);
        if (res.ok) return await res.text();
      } catch (e) {}
      
      const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(rawUrl);
      const res = await fetch(proxyUrl);
      if (!res.ok) throw new Error('Fetch failed');
      return await res.text();
    }

    function quickLoad(url) {
      document.getElementById('m3uUrl').value = url;
      loadM3U();
    }

    async function loadM3U() {
      const url = document.getElementById('m3uUrl').value.trim();
      const listContainer = document.getElementById('channelList');
      if (!url) return;

      if (url.endsWith('.m3u8')) {
        playStream(url);
        listContainer.innerHTML = `<div class="channel-item" onclick="playStream('${url}')"><span>Direct Stream</span> <span>▶</span></div>`;
        return;
      }

      listContainer.innerHTML = '<div class="channel-item">Loading playlist...</div>';

      try {
        const data = await fetchPlaylistData(url);
        parseM3U(data);
      } catch (err) {
        listContainer.innerHTML = '<div class="channel-item">Failed to load playlist.</div>';
      }
    }

    function parseM3U(content) {
      const lines = content.split('\n');
      loadedChannels = [];
      let currentChannel = null;
      const MAX_CHANNELS = 800;

      for (let i = 0; i < lines.length; i++) {
        let line = lines[i].trim();
        if (line.startsWith('#EXTINF:')) {
          const commaIdx = line.indexOf(',');
          const name = commaIdx !== -1 ? line.substring(commaIdx + 1).trim() : "Channel";
          currentChannel = { name };
        } else if (line.length > 0 && !line.startsWith('#')) {
          if (currentChannel) {
            currentChannel.url = line;
            loadedChannels.push(currentChannel);
            currentChannel = null;
            if (loadedChannels.length >= MAX_CHANNELS) break;
          }
        }
      }
      document.getElementById('channelSearch').value = '';
      renderChannelList(loadedChannels);
    }

    function filterChannels() {
      const q = document.getElementById('channelSearch').value.toLowerCase();
      renderChannelList(loadedChannels.filter(ch => ch.name.toLowerCase().includes(q)));
    }

    function renderChannelList(channels) {
      const listContainer = document.getElementById('channelList');
      listContainer.innerHTML = '';
      if (channels.length === 0) {
        listContainer.innerHTML = '<div class="channel-item">No channels found.</div>';
        return;
      }
      const frag = document.createDocumentFragment();
      channels.forEach(ch => {
        const item = document.createElement('div');
        item.className = 'channel-item';
        item.innerHTML = `<span>${ch.name}</span> <span>▶</span>`;
        item.onclick = () => playStream(ch.url);
        frag.appendChild(item);
      });
      listContainer.appendChild(frag);
    }

    function updateFilters() {
      const b = document.getElementById('slider-brightness').value;
      const c = document.getElementById('slider-contrast').value;
      const s = document.getElementById('slider-saturate').value;
      document.getElementById('val-brightness').innerText = `${b}%`;
      document.getElementById('val-contrast').innerText = `${c}%`;
      document.getElementById('val-saturate').innerText = `${s}%`;
      video.style.filter = `brightness(${b}%) contrast(${c}%) saturate(${s}%)`;
    }

    function applyPreset(b, c, s) {
      document.getElementById('slider-brightness').value = b;
      document.getElementById('slider-contrast').value = c;
      document.getElementById('slider-saturate').value = s;
      updateFilters();
    }

    function resetFilters() { applyPreset(100, 100, 100); }

    let audioCtx, gainNode, source;
    function updateAudioGain(val) {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        source = audioCtx.createMediaElementSource(video);
        gainNode = audioCtx.createGain();
        source.connect(gainNode);
        gainNode.connect(audioCtx.destination);
      }
      if (gainNode) gainNode.gain.value = val;
    }
  </script>
</body>
</html>
